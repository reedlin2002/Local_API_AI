name: Release

# Pushing a tag such as v1.1.0 builds a self-contained Windows package (no .NET install needed)
# and attaches it to a GitHub Release. The container workflow publishes the matching image tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64 (self-contained)
        run: dotnet publish LocalAIAgentAPI.csproj -c Release -r win-x64 --self-contained true -o publish/LocalAIAgentAPI

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/LocalAIAgentAPI/* -DestinationPath LocalAIAgentAPI-win-x64.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" LocalAIAgentAPI-win-x64.zip --title "${{ github.ref_name }}" --generate-notes
